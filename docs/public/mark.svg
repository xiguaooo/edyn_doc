<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="mk-title">
  <title id="mk-title">伊甸园史记</title>
  <defs>
    <!-- ===== 纸面 ===== -->
    <linearGradient id="mk-paper" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".42" stop-color="#f9f3e6"/>
      <stop offset=".78" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#e3d8c0"/>
    </linearGradient>
    <radialGradient id="mk-sheen" cx="352" cy="150" r="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mk-vignette" cx="470" cy="430" r="760" gradientUnits="userSpaceOnUse">
      <stop offset=".52" stop-color="#6d5a37" stop-opacity="0"/>
      <stop offset=".88" stop-color="#6d5a37" stop-opacity=".1"/>
      <stop offset="1" stop-color="#5c4a2a" stop-opacity=".2"/>
    </radialGradient>
    <pattern id="mk-grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#7d6840" stroke-opacity=".085" stroke-width="1.2"/>
    </pattern>
    <filter id="mk-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .33  0 0 0 0 .27  0 0 0 0 .16  .34 .34 .34 0 0"/>
    </filter>

    <!-- ===== 朱印 ===== -->
    <linearGradient id="mk-seal" x1="300" y1="286" x2="640" y2="662" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4553e"/>
      <stop offset=".28" stop-color="#b6412c"/>
      <stop offset=".62" stop-color="#a3311f"/>
      <stop offset="1" stop-color="#84200f"/>
    </linearGradient>
    <linearGradient id="mk-seal-sheen" x1="0" y1="286" x2="0" y2="662" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset=".82" stop-color="#3d0d04" stop-opacity=".1"/>
      <stop offset="1" stop-color="#3d0d04" stop-opacity=".3"/>
    </linearGradient>

    <g id="mk-shi" transform="translate(440 474) scale(6.56) translate(-32 -32.1)" fill="none" stroke="#fdf6e6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.2 17.3H45.8" stroke-width="3.4"/>
      <path d="M18.2 33.3H45.8" stroke-width="3.4"/>
      <path d="M20 17.4v15.8" stroke-width="4.3"/>
      <path d="M44 17.4v15.8" stroke-width="4.3"/>
      <path d="M32 13.8v21.8" stroke-width="4.3"/>
      <path d="M32 35.4c-1.6 6.8-5 11-11.4 15" stroke-width="4"/>
      <path d="M32 35.4c1.6 6.8 5 11 11.4 15" stroke-width="4"/>
    </g>

    <!-- 底层静物：镜片内按 1.22 倍重绘，形成真实折射而非贴图 -->
    <g id="mk-scene">
      <rect width="1024" height="1024" fill="url(#mk-paper)"/>
      <rect width="1024" height="1024" fill="url(#mk-grid)" opacity=".55"/>
      <rect width="1024" height="1024" fill="url(#mk-sheen)"/>

      <!-- 压印：纸被印章压出的浅槽 -->
      <rect x="242" y="276" width="396" height="396" rx="34" fill="#6b4b22" opacity=".13" filter="url(#mk-blur4)"/>
      <rect x="244" y="278" width="392" height="392" rx="32" fill="#fffdf4" opacity=".55" filter="url(#mk-blur2)"/>

      <rect x="252" y="286" width="376" height="376" rx="26" fill="url(#mk-seal)"/>
      <rect x="252" y="286" width="376" height="376" rx="26" fill="url(#mk-grain)" opacity=".5"/>
      <rect x="252" y="286" width="376" height="376" rx="26" fill="url(#mk-seal-sheen)"/>

      <!-- 印泥深浅不匀 -->
      <ellipse cx="330" cy="580" rx="118" ry="72" fill="#6d1304" opacity=".18" filter="url(#mk-blur14)"/>
      <ellipse cx="560" cy="346" rx="96" ry="58" fill="#e8a08c" opacity=".14" filter="url(#mk-blur14)"/>

      <!-- 印面线框 -->
      <rect x="268" y="302" width="344" height="344" rx="16" fill="none" stroke="#fdf0dc" stroke-opacity=".34" stroke-width="2.4"/>
      <rect x="252" y="286" width="376" height="376" rx="26" fill="none" stroke="#5e1206" stroke-opacity=".42" stroke-width="1.6"/>
      <rect x="255" y="289" width="370" height="370" rx="23" fill="none" stroke="#ffd9c6" stroke-opacity=".3" stroke-width="1.4"/>

      <use href="#mk-shi"/>

      <rect width="1024" height="1024" fill="url(#mk-grain)" opacity=".2"/>
      <rect width="1024" height="1024" fill="url(#mk-vignette)"/>
    </g>

    <!-- ===== 玻璃 ===== -->
    <radialGradient id="mk-glass" cx="600" cy="556" r="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset=".58" stop-color="#eef8ff" stop-opacity=".07"/>
      <stop offset=".86" stop-color="#d6f0ff" stop-opacity=".2"/>
      <stop offset=".97" stop-color="#bfe6fb" stop-opacity=".4"/>
      <stop offset="1" stop-color="#a9d6ef" stop-opacity=".52"/>
    </radialGradient>
    <linearGradient id="mk-dispersion" x1="500" y1="470" x2="800" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset=".36" stop-color="#ffc371"/>
      <stop offset=".68" stop-color="#5ff2c8"/>
      <stop offset="1" stop-color="#5f8fff"/>
    </linearGradient>
    <radialGradient id="mk-rimlight" cx="612" cy="600" r="168" gradientUnits="userSpaceOnUse">
      <stop offset=".72" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".92" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".86"/>
    </radialGradient>
    <linearGradient id="mk-brass" x1="470" y1="430" x2="830" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf3d2"/>
      <stop offset=".14" stop-color="#d9b268"/>
      <stop offset=".32" stop-color="#9a6f2c"/>
      <stop offset=".45" stop-color="#f3dda4"/>
      <stop offset=".58" stop-color="#b88940"/>
      <stop offset=".72" stop-color="#6d4a15"/>
      <stop offset=".86" stop-color="#c9a462"/>
      <stop offset="1" stop-color="#7b5620"/>
    </linearGradient>
    <linearGradient id="mk-handle" x1="770" y1="740" x2="940" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6e6bd"/>
      <stop offset=".3" stop-color="#c49a52"/>
      <stop offset=".55" stop-color="#8a6127"/>
      <stop offset=".82" stop-color="#c69f5c"/>
      <stop offset="1" stop-color="#6f4d18"/>
    </linearGradient>

    <filter id="mk-blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="mk-blur4" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="mk-blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="mk-blur10" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="mk-blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="mk-blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="mk-blur60" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="60"/></filter>

    <clipPath id="mk-card"><rect width="1024" height="1024" rx="226"/></clipPath>
    <clipPath id="mk-lens"><circle cx="612" cy="600" r="156"/></clipPath>
  </defs>

  <g clip-path="url(#mk-card)">
    <use href="#mk-scene"/>
  </g>

  <rect x="1.6" y="1.6" width="1020.8" height="1020.8" rx="224.6" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="3.2"/>
  <rect x=".9" y=".9" width="1022.2" height="1022.2" rx="225.2" fill="none" stroke="#5b4a2c" stroke-opacity=".22" stroke-width="1.8"/>

  <g opacity=".46">
    <ellipse cx="664" cy="680" rx="196" ry="188" fill="#3a2a10" filter="url(#mk-blur24)"/>
    <path d="M762 750 926 914" stroke="#3a2a10" stroke-width="60" stroke-linecap="round" filter="url(#mk-blur24)"/>
  </g>

  <g>
    <path d="M736 724 900 888" stroke="#4b3410" stroke-width="58" stroke-linecap="round" opacity=".3" filter="url(#mk-blur6)"/>
    <path d="M736 724 900 888" stroke="url(#mk-handle)" stroke-width="54" stroke-linecap="round"/>
    <path d="M744 718 894 868" stroke="#fff4d2" stroke-opacity=".42" stroke-width="12" stroke-linecap="round"/>
    <path d="M730 736 880 886" stroke="#3f2a08" stroke-opacity=".3" stroke-width="8" stroke-linecap="round"/>
    <circle cx="900" cy="888" r="27" fill="url(#mk-handle)"/>
    <circle cx="894" cy="882" r="10" fill="#fff6da" opacity=".28"/>
  </g>

  <circle cx="612" cy="600" r="173" fill="none" stroke="#503508" stroke-width="36" opacity=".35"/>
  <circle cx="612" cy="600" r="173" fill="none" stroke="url(#mk-brass)" stroke-width="34"/>
  <circle cx="612" cy="600" r="173" fill="none" stroke="#fffbe8" stroke-opacity=".3" stroke-width="2.5"/>
  <circle cx="612" cy="600" r="188" fill="none" stroke="#43300a" stroke-width="2" stroke-opacity=".55"/>
  <circle cx="612" cy="600" r="158" fill="none" stroke="#3d2a08" stroke-width="3" stroke-opacity=".6"/>
  <circle cx="612" cy="600" r="156" fill="none" stroke="#fff3cf" stroke-opacity=".45" stroke-width="2"/>

  <g clip-path="url(#mk-lens)">
    <!-- 折射光轴略偏镜心：镜内画面相对镜外整体位移并放大，形成玻璃错位 -->
    <use href="#mk-scene" transform="translate(-168 -163.5) scale(1.3)"/>
    <circle cx="612" cy="600" r="156" fill="url(#mk-glass)"/>
    <circle cx="612" cy="600" r="156" fill="none" stroke="#5f7488" stroke-opacity=".12" stroke-width="14"/>
    <circle cx="612" cy="600" r="150" fill="none" stroke="url(#mk-dispersion)" stroke-opacity=".2" stroke-width="9"/>
    <circle cx="612" cy="600" r="143" fill="none" stroke="url(#mk-dispersion)" stroke-opacity=".11" stroke-width="4"/>
    <circle cx="612" cy="600" r="156" fill="url(#mk-rimlight)"/>
    <!-- 镜面反光：贴边柔光带 + 锐亮线，端点重合避免双线感 -->
    <path d="M480 570Q498 496 574 468" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="34" stroke-linecap="round" filter="url(#mk-blur10)"/>
    <path d="M488 556Q506 498 568 474" fill="none" stroke="#ffffff" stroke-opacity=".72" stroke-width="8" stroke-linecap="round" filter="url(#mk-blur2)"/>
    <path d="M492 550Q510 502 562 480" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <!-- 底部环境反光 -->
    <path d="M666 716Q702 702 720 672" fill="none" stroke="#ffffff" stroke-opacity=".26" stroke-width="12" stroke-linecap="round" filter="url(#mk-blur6)"/>
    <ellipse cx="676" cy="686" rx="58" ry="24" transform="rotate(-42 676 686)" fill="#dff2ff" opacity=".14" filter="url(#mk-blur10)"/>
  </g>

  <circle cx="500" cy="524" r="9" fill="#ffffff" opacity=".85" filter="url(#mk-blur2)"/>
  <circle cx="500" cy="524" r="3.6" fill="#ffffff"/>

  <g clip-path="url(#mk-card)">
    <path d="M-80 620 700-160 900-160 120 760Z" fill="#ffffff" opacity=".07"/>
    <ellipse cx="512" cy="-120" rx="760" ry="300" fill="#ffffff" opacity=".34" filter="url(#mk-blur60)"/>
    <ellipse cx="560" cy="1150" rx="800" ry="300" fill="#a68c5e" opacity=".22" filter="url(#mk-blur60)"/>
  </g>
</svg>
